meters:
- name: platform_fee
  description: Recurring monthly platform fee that unlocks the functionality of the contracted tier.
  unit: subscription
  aggregation: flat
  dimensions:
  - account
  - tier
- name: synced_persons
  description: Unique users whose data is provided to the learning platform in a billing month, billed per person.
  unit: persons
  aggregation: distinct_count
  dimensions:
  - account
  - integration
  - district
principles:
- name: Visibility
  description: Track unique synced-person counts per integration and district against the contracted tier each month.
- name: Allocation
  description: Tag integrations and access tokens per customer or product so synced-person cost maps to internal cost centers.
- name: Optimization
  description: Limit syncs to the roster actually needed; prune inactive users and unshared schools to reduce per-synced-person fees; use incremental events to avoid over-provisioning.
- name: Accountability
  description: Assign owners per integration; review synced-person trends monthly against budget and tier thresholds.
