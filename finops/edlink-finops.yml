description: >-
  FinOps view of Edlink spend. Edlink bills edtech customers a recurring Monthly
  Platform Fee per tier plus an Additional Synced Person Fee charged per unique
  user whose data is provided to the learning platform each month. Because the
  dominant cost driver is the count of synced persons, cost optimization centers
  on minimizing the unique-user footprint actually synced per billing period.
  Concrete per-tier and per-synced-person dollar amounts are sales-negotiated and
  not publicly itemized, so they are not reconciled in this artifact.
notes: >-
  Confirm platform-fee amounts, per-synced-person rates, billing frequency, and
  any annual-commitment discounts against an Edlink quote during reconciliation.
