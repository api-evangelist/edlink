aid: edlink
url: https://raw.githubusercontent.com/api-evangelist/edlink/refs/heads/main/apis.yml
name: Edlink
kind: company
description: Edlink is an education-integration platform offering a unified API for
  rostering and school data across SIS and LMS systems. The Edlink Graph API exposes
  normalized districts, schools, classes, sections, courses, people, and enrollments
  from hundreds of source systems behind a single Bearer-authenticated REST interface,
  plus SSO, source integrations, and change events.
